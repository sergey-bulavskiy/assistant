name: assistant
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/sergey-bulavskiy/assistant:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      ConnectionStrings__Assistant: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=postgres;Password=${POSTGRES_PASSWORD}
      # Private diagnostics require explicit local opt-in. Limits cannot exceed these ceilings.
      DEBUG_TRACES_ENABLED: ${DEBUG_TRACES_ENABLED:-false}
      DEBUG_TRACES_RETENTION_DAYS: ${DEBUG_TRACES_RETENTION_DAYS:-60}
      DEBUG_TRACES_MAX_DETAIL_BYTES: ${DEBUG_TRACES_MAX_DETAIL_BYTES:-262144}
      DEBUG_TRACES_MAX_STORAGE_BYTES: ${DEBUG_TRACES_MAX_STORAGE_BYTES:-104857600}
      DEBUG_TRACES_MAX_EVENTS: ${DEBUG_TRACES_MAX_EVENTS:-256}
      # LLM_MODELS has no default: model access stays off until explicitly configured and logged in.
      # See README "Set up the General assistant". Every *limit*
      # below does get a default matching .env.example, since the app itself still requires them
      # (LlmConfigParser turns the whole config off if any limit is missing/invalid) -- an .env that
      # only sets LLM_MODELS still receives valid limits.
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-10}
      LLM_CALLS_PER_DAY: ${LLM_CALLS_PER_DAY:-200}
      LLM_MAX_CONTEXT_MESSAGES: ${LLM_MAX_CONTEXT_MESSAGES:-30}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-40000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4000}
      LLM_CALL_TIMEOUT_SECONDS: ${LLM_CALL_TIMEOUT_SECONDS:-120}
      LLM_MAX_CONCURRENT_CALLS: ${LLM_MAX_CONCURRENT_CALLS:-2}
      LLM_MODEL_COOLDOWN_MINUTES: ${LLM_MODEL_COOLDOWN_MINUTES:-30}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Pinned Claude Code CLI version the hosted service installs (spec §8.10). Empty/unset falls
      # back to this plan's own pinned default inside the app (Task 9) -- an .env without this
      # variable still gets a working, reviewed version, never "latest".
      CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-2.1.285}
      # M3b: paid API providers and the platform-wide money budget (all optional; empty = that
      # provider/feature stays off, same "app always starts" rule as every LLM_* var above).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_PROXY: ${ANTHROPIC_PROXY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_PROXY: ${OPENAI_PROXY:-}
      LLM_PRICES: ${LLM_PRICES:-}
      LLM_FAST_MODELS: ${LLM_FAST_MODELS:-}
      LLM_BUDGET_DAILY_USD: ${LLM_BUDGET_DAILY_USD:-}
      LLM_BUDGET_MONTHLY_USD: ${LLM_BUDGET_MONTHLY_USD:-}
      LLM_BUDGET_WARN_PERCENT: ${LLM_BUDGET_WARN_PERCENT:-80}
      LLM_BUDGET_HARD_PERCENT: ${LLM_BUDGET_HARD_PERCENT:-120}
    volumes:
      - claude-home:/home/app/.claude-home
      - codex-home:/home/app/.codex
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  claude-home:
  codex-home:
