name: assistant
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/sergey-bulavskiy/assistant:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_MANAGER_BOT_TOKEN: ${TELEGRAM_MANAGER_BOT_TOKEN}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      ConnectionStrings__Assistant: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=postgres;Password=${POSTGRES_PASSWORD}
      LLM_MODELS: ${LLM_MODELS:-}
      LLM_CALLS_PER_MINUTE: ${LLM_CALLS_PER_MINUTE:-}
      LLM_CALLS_PER_DAY: ${LLM_CALLS_PER_DAY:-}
      LLM_MAX_CONTEXT_MESSAGES: ${LLM_MAX_CONTEXT_MESSAGES:-}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
      LLM_CALL_TIMEOUT_SECONDS: ${LLM_CALL_TIMEOUT_SECONDS:-}
      LLM_MAX_CONCURRENT_CALLS: ${LLM_MAX_CONCURRENT_CALLS:-}
      LLM_MODEL_COOLDOWN_MINUTES: ${LLM_MODEL_COOLDOWN_MINUTES:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Pinned Claude Code CLI version the hosted service installs (spec §8.10). Empty/unset falls
      # back to this plan's own pinned default inside the app (Task 9) -- an .env without this
      # variable still gets a working, reviewed version, never "latest".
      CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-2.1.285}
    volumes:
      - claude-home:/home/app/.claude-home
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  claude-home:
