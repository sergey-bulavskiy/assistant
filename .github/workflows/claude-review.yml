name: claude-review

# Runs only when a PR gets the `claude-review` label. Adding labels needs write access, and the
# job refuses PRs from forks, so the OAuth secret is never exposed to outside code.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repository is PUBLIC.

            1. Read the root AGENTS.md and every local AGENTS.md whose folder the diff touches
               (use `gh pr diff` to see changed files).
            2. Review strictly against the "Code review checklist" in the root AGENTS.md and,
               for test changes, the test quality rules in tests/AGENTS.md.
            3. Post inline comments on specific lines, and put the summary in your tracking
               comment with findings grouped as blocking / should-fix / nit, or say there are none.

            Privacy: if you suspect personal data, a real identifier or a secret in the diff,
            report it only as "possible personal data or secret at <file>:<line>" and never
            quote or repeat the value in any comment. Do not suggest changes to files outside
            the diff unless a checklist item requires it.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
