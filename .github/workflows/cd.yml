name: cd
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deployment-hold:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Deployment is on hold pending explicit approval of the replacement cutover.'
