name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.changes.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify classifier
        run: python3 -B -m unittest discover -s .github/scripts -p test_classify.py -v
      - name: Verify live evidence checks offline
        run: python3 -B -m unittest discover -s tests/live -p 'test_*.py' -v
      - id: changes
        env:
          CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/classify.py
  build-and-test:
    needs: classify
    if: needs.classify.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release -warnaserror -v q -nologo
      - run: dotnet test -c Release -v q --logger "console;verbosity=minimal"
      - run: docker build -t assistant-ci .
  gate:
    if: always()
    needs: [classify, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require classifier and applicable checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          APPLICATION: ${{ needs.classify.outputs.application }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$APPLICATION" = true ]; then
            test "$BUILD_RESULT" = success
          elif [ "$APPLICATION" = false ]; then
            test "$BUILD_RESULT" = skipped
          else
            exit 1
          fi
