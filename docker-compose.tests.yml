name: assistant-tests
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  integresql:
    image: ghcr.io/allaboutapps/integresql:v1.1.0
    environment:
      INTEGRESQL_PGHOST: postgres
      INTEGRESQL_PGUSER: postgres
      INTEGRESQL_PGPASSWORD: postgres
      # Kept in sync with IntegreSqlPool.cs's Testcontainers path — see the comment there for why
      # these are fixed rather than left at their runtime.NumCPU()-derived defaults.
      INTEGRESQL_TEST_INITIAL_POOL_SIZE: "10"
      INTEGRESQL_TEST_MAX_POOL_SIZE: "20"
      INTEGRESQL_POOL_MAX_PARALLEL_TASKS: "4"
    ports:
      - "15000:5000"
    depends_on:
      postgres:
        condition: service_healthy
